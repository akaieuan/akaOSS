name: Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify generated primitives and registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/components/hitl, public/r and src/lib/registry-items.ts are
      # generated from @hitl-kit/ui (hitl-ai2/packages/ui). Without the
      # library checkout the script derives the site's copy from the
      # committed public/r/*.json and fails if the three disagree.
      - name: Check generated primitives for drift
        run: pnpm hitl:check
